<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USwap · Editar perfil</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- =====================================================================
       PANTALLA: EDITAR PERFIL               Propietario: P4 (sergiooleeonn)
       Solo se editan este archivo, perfil.html y js/perfil.js / editar-perfil.js.
       ===================================================================== -->
  <div class="app">
    <header id="topbar"></header>

    <main class="contenido">
      <section style="position:relative;border-radius:22px;padding:18px;color:#fff;margin-bottom:14px;
                      background:radial-gradient(120% 115% at 88% -18%, rgba(91,91,246,.62) 0%, rgba(91,91,246,0) 58%),
                                 linear-gradient(158deg,#16203a 0%,#0d1424 100%)">
        <div style="font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.48)">
          Credencial USwap
        </div>
        <h1 style="margin:9px 0 5px;font-size:23px;letter-spacing:-.8px;line-height:1.15">Tu perfil</h1>
        <p style="margin:0;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.68)">
          Así te verán los demás cuando abran tu credencial.
        </p>
      </section>

      <form id="form-perfil" class="bloque" novalidate style="padding:18px 18px 16px">
        <div style="font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Identidad</div>

        <label class="label" for="nombre">Nombre</label>
        <input class="input" id="nombre" required maxlength="40">

        <label class="label" for="carrera">Carrera</label>
        <input class="input" id="carrera" maxlength="60" placeholder="Ej. Ingeniería Informática">

        <div class="fila" style="margin-top:16px">
          <div style="flex:1">
            <label class="label" style="margin-top:0" for="curso">Curso</label>
            <select class="select" id="curso"></select>
          </div>
          <div style="flex:1">
            <label class="label" style="margin-top:0" for="area">Área</label>
            <select class="select" id="area"></select>
          </div>
        </div>

        <label class="label" for="habilidades">Habilidades</label>
        <input class="input" id="habilidades" placeholder="Python, Diseño UI, Inglés">
        <div class="usuario-detalle" style="margin-top:5px">Sepáralas con comas. Son las que verá la gente en tu perfil.</div>

        <label class="label" for="bio">Sobre ti</label>
        <textarea class="textarea" id="bio" maxlength="180" placeholder="Qué estudias, qué se te da bien, qué ofreces…"></textarea>
        <div class="usuario-detalle" id="contador-bio" style="margin-top:6px;text-align:right;font-variant-numeric:tabular-nums">0 / 180</div>

        <div style="height:1px;background:#eef1f7;margin:22px 0 18px"></div>
        <div style="font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Contacto</div>

        <label class="label" for="instagram">Instagram</label>
        <input class="input" id="instagram" placeholder="sergio.leon">
        <div class="usuario-detalle" style="margin-top:5px">Solo el nombre de usuario, sin la arroba.</div>

        <label class="label" for="whatsapp">WhatsApp</label>
        <input class="input" id="whatsapp" placeholder="34600111222">
        <div class="usuario-detalle" style="margin-top:5px">Con prefijo del país y sin el signo +.</div>

        <button class="btn btn-primario btn-bloque" style="margin-top:22px" type="submit">Guardar cambios</button>
        <a class="btn btn-secundario" style="margin-top:8px" href="perfil.html">Cancelar</a>
      </form>
    </main>

    <nav id="bottomnav"></nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editar-perfil.js"></script>
</body>
</html>
