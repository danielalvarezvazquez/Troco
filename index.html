<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Troco · Tablón · USC</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- =====================================================================
       PANTALLA: TABLÓN                        Propietario: P2 (Javierbarcala)
       Solo se editan este archivo y js/board.js.
       ===================================================================== -->
  <div class="app">
    <header id="topbar"></header>

    <main class="contenido">
      <section class="hero">
        <div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8592a6;margin-bottom:7px">
          USC · Santiago de Compostela
        </div>
        <h1>Tablón de favores</h1>
        <p id="hero-sub">Lo que piden estudiantes de la USC. Si te encaja, responde y llegad a un acuerdo.</p>
      </section>

      <input id="buscador" class="input" type="search"
             placeholder="Busca apuntes, clases o transporte…" autocomplete="off">

      <div id="filtro-categorias" class="chips" style="margin-top:10px"></div>
      <div id="filtro-areas" class="chips"></div>
      <div id="filtro-carreras" class="chips"></div>
      <div id="filtro-cursos" class="chips"></div>

      <div class="resultado-info" style="display:flex;align-items:center;gap:8px">
        <span id="resultado-info"></span>
        <button id="btn-limpiar" type="button" class="chip chip-mini oculto" style="margin-left:auto">Limpiar</button>
      </div>

      <select id="orden" class="select" aria-label="Ordenar el tablón" style="margin-bottom:10px">
        <option value="destacada">Destacadas primero</option>
        <option value="reciente">Más recientes</option>
        <option value="valoracion">Mejor valorados</option>
      </select>

      <div id="lista" class="lista"></div>
    </main>

    <button class="arriba" id="btn-arriba" type="button" aria-label="Volver arriba">↑</button>

    <nav id="bottomnav"></nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
