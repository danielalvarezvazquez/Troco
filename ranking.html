<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troco · Ranking · USC</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- =====================================================================
       PANTALLA: RANKING + RECOMPENSAS         Propietario: P3 (tome123456)
       Solo se editan este archivo y js/ranking.js.
       Regla de puntos: 10 por estrella (★1 = 10 … ★5 = 50)
       ===================================================================== -->
  <div class="app">
    <header id="topbar"></header>

    <main class="contenido">
      <section class="hero">
        <div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8592a6;margin-bottom:7px">
          USC · Santiago de Compostela
        </div>
        <h1>Ranking y recompensas</h1>
        <p>Cada estrella cuenta. Cuanto mejor te valoren, más arriba estás y mejor se ve tu nombre.</p>
      </section>

      <div id="mi-posicion"></div>

      <div class="chips" id="filtro-rama" role="group" aria-label="Filtrar el ranking por rama" style="margin-top:12px"></div>

      <div class="seccion-titulo"><h2>Clasificación</h2><span class="usuario-detalle" id="total-gente"></span></div>
      <div id="ranking" class="lista"></div>

      <div class="seccion-titulo"><h2>Recompensas por nivel</h2></div>
      <div id="recompensas" class="bloque"></div>
    </main>

    <nav id="bottomnav"></nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
